plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bitacora.campo'
    compileSdk 34

    defaultConfig {
        applicationId "com.bitacora.campo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // URL base de la API (tarea 2.2). 10.0.2.2 = la máquina local vista desde el emulador.
        // Cambiar el puerto según el servidor. Debe terminar en "/".
        buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:3000/api/\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.activity:activity:1.9.2'

    // MVVM
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'

    // Retrofit + Gson + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1' // JsonParser.parseString requiere >= 2.8.6
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
